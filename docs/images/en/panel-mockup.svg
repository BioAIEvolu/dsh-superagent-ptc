<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" width="100%" font-family="system-ui,sans-serif">
<title>Right panel anatomy</title>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#85B7EB"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#AFA9EC"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5DCAA5"/></marker>
</defs>
<text x="40" y="26" font-size="15" font-weight="600" fill="#1F2937">Right panel anatomy</text>
<text x="40" y="44" font-size="12"  fill="#1F2937" opacity="0.65">Read-only projection of the run: objective, gate, evidence and audit</text>
<rect x="40" y="70" width="600" height="330" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<rect x="56" y="84" width="280" height="56" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="70" y="106" font-size="13" font-weight="600" fill="#0C447C">Objective and Anchor</text>
<text x="70" y="125" font-size="11" fill="#0C447C" opacity="0.8">version, work items, gate policy</text>
<rect x="348" y="84" width="276" height="56" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="362" y="106" font-size="13" font-weight="600" fill="#0C447C">Model policy and routing</text>
<text x="362" y="125" font-size="11" fill="#0C447C" opacity="0.8">allowed routes, budget, failures</text>
<rect x="56" y="152" width="280" height="76" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="70" y="174" font-size="13" font-weight="600" fill="#0C447C">Work items</text>
<text x="70" y="193" font-size="11" fill="#0C447C" opacity="0.8">status, attempt, current mandate</text>
<rect x="348" y="152" width="276" height="76" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="362" y="174" font-size="13" font-weight="600" fill="#0C447C">Mandate</text>
<text x="362" y="193" font-size="11" fill="#0C447C" opacity="0.8">worker, reviewer, write scope</text>
<rect x="56" y="240" width="280" height="76" rx="8" fill="#9FE1CB" stroke="#5DCAA5"/>
<text x="70" y="262" font-size="13" font-weight="600" fill="#085041">Evidence and gate</text>
<text x="70" y="281" font-size="11" fill="#085041" opacity="0.8">kind, result, source role</text>
<rect x="348" y="240" width="276" height="76" rx="8" fill="#9FE1CB" stroke="#5DCAA5"/>
<text x="362" y="262" font-size="13" font-weight="600" fill="#085041">Audit timeline</text>
<text x="362" y="281" font-size="11" fill="#085041" opacity="0.8">every mutation with revision</text>
<rect x="56" y="328" width="568" height="56" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="70" y="350" font-size="13" font-weight="600" fill="#0C447C">Composer entry: Super Agent supervision</text>
<text x="70" y="369" font-size="11" fill="#0C447C" opacity="0.8">opens the panel, never blocks the chat input</text>
<text x="40" y="424" font-size="12"  fill="#1F2937" opacity="0.6">The panel never writes state; it only reads the projection through a read-only RPC</text>
</svg>