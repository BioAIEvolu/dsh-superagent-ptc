<svg viewBox="0 0 680 592" width="100%" font-family="system-ui,sans-serif">
<title>SuperAgent PTC dual-layer architecture</title>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#85B7EB"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#AFA9EC"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5DCAA5"/></marker>
</defs>
<text x="40" y="26" font-size="15" font-weight="600" fill="#1F2937">SuperAgent PTC dual-layer architecture</text>
<text x="40" y="44" font-size="12"  fill="#1F2937" opacity="0.65">The supervision plane decides what may ship; the execution plane decides what happened</text>
<rect x="40" y="58" width="12" height="12" rx="3" fill="#B5D4F4"/><text x="58" y="68" font-size="12"  fill="#1F2937">Supervision plane</text>
<rect x="190" y="58" width="12" height="12" rx="3" fill="#CECBF6"/><text x="208" y="68" font-size="12"  fill="#1F2937">Execution plane</text>
<rect x="340" y="58" width="12" height="12" rx="3" fill="#9FE1CB"/><text x="358" y="68" font-size="12"  fill="#1F2937">Native runtime</text>
<rect x="40" y="96" width="600" height="168" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="52" y="116" font-size="12" font-weight="600" fill="#1F2937" opacity="0.75">A  Supervision plane (Control Plane)</text>
<rect x="56" y="126" width="276" height="52" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="70" y="148" font-size="13" font-weight="600" fill="#0C447C">Lead, objective and Anchor</text>
<text x="70" y="167" font-size="11" fill="#0C447C" opacity="0.8">versioned anchor, obligations, corrections</text>
<rect x="348" y="126" width="276" height="52" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="362" y="148" font-size="13" font-weight="600" fill="#0C447C">Mandate contract</text>
<text x="362" y="167" font-size="11" fill="#0C447C" opacity="0.8">work item, write scope, routing, attempt</text>
<rect x="56" y="196" width="276" height="52" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="70" y="218" font-size="13" font-weight="600" fill="#0C447C">Worker and Reviewer</text>
<text x="70" y="237" font-size="11" fill="#0C447C" opacity="0.8">bound native SessionIds; Reviewer read-only</text>
<rect x="348" y="196" width="276" height="52" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="362" y="218" font-size="13" font-weight="600" fill="#0C447C">Evidence gate and release</text>
<text x="362" y="237" font-size="11" fill="#0C447C" opacity="0.8">pass, fail, unknown; independent acceptance</text>
<rect x="40" y="288" width="600" height="48" rx="8" fill="#F6F8FA" stroke="#85B7EB" stroke-dasharray="6 4"/>
<text x="56" y="317" font-size="11"  fill="#1F2937" opacity="0.8">Contract membrane: super_* tools are the only writer of state and evidence (CAS)</text>
<rect x="40" y="360" width="600" height="152" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="52" y="380" font-size="12" font-weight="600" fill="#1F2937" opacity="0.75">B  Execution plane (Execution Plane)</text>
<rect x="56" y="390" width="276" height="50" rx="8" fill="#CECBF6" stroke="#AFA9EC"/>
<text x="70" y="412" font-size="13" font-weight="600" fill="#3C3489">run_code orchestration</text>
<text x="70" y="431" font-size="11" fill="#3C3489" opacity="0.8">TypeScript calls host tools</text>
<rect x="348" y="390" width="276" height="50" rx="8" fill="#CECBF6" stroke="#AFA9EC"/>
<text x="362" y="412" font-size="13" font-weight="600" fill="#3C3489">Host tool surface</text>
<text x="362" y="431" font-size="11" fill="#3C3489" opacity="0.8">read, write, pwsh, grep, glob and more</text>
<rect x="56" y="452" width="276" height="50" rx="8" fill="#CECBF6" stroke="#AFA9EC"/>
<text x="70" y="474" font-size="13" font-weight="600" fill="#3C3489">Native subagent dispatch</text>
<text x="70" y="493" font-size="11" fill="#3C3489" opacity="0.8">Lead creates Worker and Reviewer</text>
<rect x="348" y="452" width="276" height="50" rx="8" fill="#CECBF6" stroke="#AFA9EC"/>
<text x="362" y="474" font-size="13" font-weight="600" fill="#3C3489">Execution receipts</text>
<text x="362" y="493" font-size="11" fill="#3C3489" opacity="0.8">reported_done, tool results, evidence raw</text>
<rect x="40" y="528" width="600" height="34" rx="8" fill="#9FE1CB" stroke="#5DCAA5"/>
<text x="54" y="550" font-size="13" font-weight="600" fill="#085041">Native runtime: Session, Agent, Teams + storageDomain and SnapshotProof</text>
<text x="54" y="569" font-size="11" fill="#085041" opacity="0.8">shared foundation for both planes</text>
<line x1="460" y1="264" x2="460" y2="356" stroke="#85B7EB" stroke-width="2" marker-end="url(#a1)"/>
<line x1="560" y1="356" x2="560" y2="268" stroke="#5DCAA5" stroke-width="2" marker-end="url(#a3)"/>
<line x1="196" y1="502" x2="196" y2="526" stroke="#AFA9EC" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<text x="466" y="352" font-size="11"  fill="#1F2937" opacity="0.75">delegate: mandate and instructions</text>
<text x="548" y="300" font-size="11"  fill="#1F2937" opacity="0.75">return: report and evidence</text>
<text x="204" y="520" font-size="11"  fill="#1F2937" opacity="0.75">native tools and subagent</text>
</svg>