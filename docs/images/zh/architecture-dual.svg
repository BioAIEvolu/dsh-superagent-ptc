<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 592" width="100%" font-family="system-ui,sans-serif">
<title>SuperAgent PTC 双层架构</title>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#85B7EB"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#AFA9EC"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5DCAA5"/></marker>
</defs>
<text x="40" y="26" font-size="15" font-weight="600" fill="#1F2937">SuperAgent PTC 双层架构</text>
<text x="40" y="44" font-size="12"  fill="#1F2937" opacity="0.65">监督面决定「能不能放行」，执行面决定「实际做了什么」</text>
<rect x="40" y="58" width="12" height="12" rx="3" fill="#B5D4F4"/><text x="58" y="68" font-size="12"  fill="#1F2937">监督面</text>
<rect x="140" y="58" width="12" height="12" rx="3" fill="#CECBF6"/><text x="158" y="68" font-size="12"  fill="#1F2937">执行面</text>
<rect x="240" y="58" width="12" height="12" rx="3" fill="#9FE1CB"/><text x="258" y="68" font-size="12"  fill="#1F2937">原生运行时</text>
<rect x="40" y="96" width="600" height="168" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="52" y="116" font-size="12" font-weight="600" fill="#1F2937" opacity="0.75">A 监督面（Control Plane）</text>
<rect x="56" y="126" width="276" height="52" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="70" y="148" font-size="13" font-weight="600" fill="#0C447C">Lead · 目标与 Anchor</text>
<text x="70" y="167" font-size="11" fill="#0C447C" opacity="0.8">版本化锚点 · 义务 · 纠正</text>
<rect x="348" y="126" width="276" height="52" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="362" y="148" font-size="13" font-weight="600" fill="#0C447C">Mandate 委派合同</text>
<text x="362" y="167" font-size="11" fill="#0C447C" opacity="0.8">工作项 · 写域 · 路由 · attempt</text>
<rect x="56" y="196" width="276" height="52" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="70" y="218" font-size="13" font-weight="600" fill="#0C447C">Worker 与 Reviewer</text>
<text x="70" y="237" font-size="11" fill="#0C447C" opacity="0.8">原生 SessionId 绑定；Reviewer 只读</text>
<rect x="348" y="196" width="276" height="52" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="362" y="218" font-size="13" font-weight="600" fill="#0C447C">证据门与放行</text>
<text x="362" y="237" font-size="11" fill="#0C447C" opacity="0.8">pass / fail / unknown；独立验收</text>
<rect x="40" y="288" width="600" height="48" rx="8" fill="#F6F8FA" stroke="#85B7EB" stroke-dasharray="6 4"/>
<text x="56" y="317" font-size="11"  fill="#1F2937" opacity="0.8">契约膜：super_* 是状态与证据的唯一写入口（CAS）</text>
<rect x="40" y="360" width="600" height="152" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="52" y="380" font-size="12" font-weight="600" fill="#1F2937" opacity="0.75">B 执行面（Execution Plane）</text>
<rect x="56" y="390" width="276" height="50" rx="8" fill="#CECBF6" stroke="#AFA9EC"/>
<text x="70" y="412" font-size="13" font-weight="600" fill="#3C3489">run_code 编排</text>
<text x="70" y="431" font-size="11" fill="#3C3489" opacity="0.8">TypeScript 调用宿主工具</text>
<rect x="348" y="390" width="276" height="50" rx="8" fill="#CECBF6" stroke="#AFA9EC"/>
<text x="362" y="412" font-size="13" font-weight="600" fill="#3C3489">宿主工具面</text>
<text x="362" y="431" font-size="11" fill="#3C3489" opacity="0.8">read / write / pwsh / grep / glob 等</text>
<rect x="56" y="452" width="276" height="50" rx="8" fill="#CECBF6" stroke="#AFA9EC"/>
<text x="70" y="474" font-size="13" font-weight="600" fill="#3C3489">原生 subagent 派发</text>
<text x="70" y="493" font-size="11" fill="#3C3489" opacity="0.8">Lead 创建 Worker 与 Reviewer</text>
<rect x="348" y="452" width="276" height="50" rx="8" fill="#CECBF6" stroke="#AFA9EC"/>
<text x="362" y="474" font-size="13" font-weight="600" fill="#3C3489">执行回执</text>
<text x="362" y="493" font-size="11" fill="#3C3489" opacity="0.8">reported_done · 工具结果 · 证据素材</text>
<rect x="40" y="522" width="600" height="56" rx="8" fill="#9FE1CB" stroke="#5DCAA5"/>
<text x="54" y="546" font-size="13" font-weight="600" fill="#085041">原生运行时：Session / Agent / Teams + storageDomain 与 SnapshotProof</text>
<text x="54" y="565" font-size="11" fill="#085041" opacity="0.8">两层共享的底座</text>
<line x1="460" y1="264" x2="460" y2="356" stroke="#85B7EB" stroke-width="2" marker-end="url(#a1)"/>
<line x1="560" y1="356" x2="560" y2="268" stroke="#5DCAA5" stroke-width="2" marker-end="url(#a3)"/>
<line x1="196" y1="502" x2="196" y2="526" stroke="#AFA9EC" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<text x="494" y="352" font-size="10" text-anchor="end"  fill="#1F2937" opacity="0.75">委派：mandate</text>
<text x="566" y="352" font-size="10"  fill="#1F2937" opacity="0.75">回传：证据</text>
<text x="204" y="520" font-size="11"  fill="#1F2937" opacity="0.75">原生工具与 subagent</text>
</svg>