<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="100%" font-family="system-ui,sans-serif">
<title>SuperAgent PTC layered architecture</title>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#85B7EB"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#AFA9EC"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5DCAA5"/></marker>
</defs>
<text x="40" y="26" font-size="15" font-weight="600" fill="#1F2937">SuperAgent PTC 架构（当前实现）</text>
<text x="40" y="44" font-size="12"  fill="#1F2937" opacity="0.65">建立于原生 DSH 运行时之上的 preset-first 监管层</text>
<rect x="40" y="58" width="12" height="12" rx="3" fill="#B5D4F4"/><text x="58" y="68" font-size="12"  fill="#1F2937">监管层</text>
<rect x="190" y="58" width="12" height="12" rx="3" fill="#FAC775"/><text x="208" y="68" font-size="12"  fill="#1F2937">Reviewer</text>
<rect x="340" y="58" width="12" height="12" rx="3" fill="#CECBF6"/><text x="358" y="68" font-size="12"  fill="#1F2937">原生运行时</text>
<rect x="490" y="58" width="12" height="12" rx="3" fill="#9FE1CB"/><text x="508" y="68" font-size="12"  fill="#1F2937">持久化与证明</text>
<rect x="40" y="104" width="600" height="88" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="52" y="122" font-size="12"  fill="#1F2937" opacity="0.7">① 角色</text>
<rect x="56" y="130" width="186" height="50" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="70" y="152" font-size="13" font-weight="600" fill="#0C447C">Lead</text>
<text x="70" y="171" font-size="11" fill="#0C447C" opacity="0.8">super-agent 预设</text>
<rect x="256" y="130" width="160" height="50" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="270" y="152" font-size="13" font-weight="600" fill="#0C447C">Worker</text>
<text x="270" y="171" font-size="11" fill="#0C447C" opacity="0.8">继承 super-agent</text>
<rect x="430" y="130" width="194" height="50" rx="8" fill="#FAC775" stroke="#EF9F27"/>
<text x="444" y="152" font-size="13" font-weight="600" fill="#633806">Reviewer</text>
<text x="444" y="171" font-size="11" fill="#633806" opacity="0.8">standard 预设 · 只读</text>
<rect x="40" y="208" width="600" height="200" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="52" y="226" font-size="12"  fill="#1F2937" opacity="0.7">② 监管插件：全局 Host 行 + Client 模块</text>
<rect x="56" y="236" width="280" height="54" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="70" y="258" font-size="13" font-weight="600" fill="#0C447C">七项 super_* 工具</text>
<text x="70" y="277" font-size="11" fill="#0C447C" opacity="0.8">通过 PTC run_code 调用</text>
<rect x="352" y="236" width="272" height="54" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="366" y="258" font-size="13" font-weight="600" fill="#0C447C">Reviewer 只读守卫</text>
<text x="366" y="277" font-size="11" fill="#0C447C" opacity="0.8">只读分类 · fail-closed</text>
<rect x="56" y="300" width="280" height="54" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="70" y="322" font-size="13" font-weight="600" fill="#0C447C">Core 状态机</text>
<text x="70" y="341" font-size="10" fill="#0C447C" opacity="0.8">Run → Anchor → Mandate → Evidence → Decision</text>
<rect x="352" y="300" width="272" height="54" rx="8" fill="#B5D4F4" stroke="#85B7EB"/>
<text x="366" y="322" font-size="13" font-weight="600" fill="#0C447C">Client</text>
<text x="366" y="341" font-size="11" fill="#0C447C" opacity="0.8">右栏面板 + composer 入口</text>
<rect x="56" y="364" width="568" height="40" rx="8" fill="#9FE1CB" stroke="#5DCAA5"/>
<text x="70" y="386" font-size="13" font-weight="600" fill="#085041">storageDomain RunState v2 + SnapshotProof</text>
<text x="70" y="400" font-size="11" fill="#085041" opacity="0.8">先证明，再落存储，最后替换 core</text>
<rect x="40" y="426" width="600" height="88" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="52" y="444" font-size="12"  fill="#1F2937" opacity="0.7">③ 原生 DSH 运行时（执行权威）</text>
<rect x="56" y="452" width="280" height="50" rx="8" fill="#CECBF6" stroke="#AFA9EC"/>
<text x="70" y="474" font-size="13" font-weight="600" fill="#3C3489">Session, Agent, Goal, Teams</text>
<text x="70" y="493" font-size="11" fill="#3C3489" opacity="0.8">身份与生命周期权威</text>
<rect x="352" y="452" width="272" height="50" rx="8" fill="#CECBF6" stroke="#AFA9EC"/>
<text x="366" y="474" font-size="13" font-weight="600" fill="#3C3489">PTC run_code · 原生 subagent</text>
<text x="366" y="493" font-size="11" fill="#3C3489" opacity="0.8">sendMessage 唤醒 · 会话日志</text>
<line x1="149" y1="184" x2="149" y2="210" stroke="#85B7EB" stroke-width="2" marker-end="url(#a1)"/>
<line x1="527" y1="184" x2="527" y2="210" stroke="#AFA9EC" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<line x1="196" y1="290" x2="196" y2="298" stroke="#85B7EB" stroke-width="2" marker-end="url(#a1)"/>

<line x1="340" y1="327" x2="350" y2="327" stroke="#AFA9EC" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<line x1="196" y1="404" x2="196" y2="424" stroke="#AFA9EC" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<text x="156" y="202" font-size="11"  fill="#1F2937" opacity="0.75">super_*</text>
<text x="534" y="202" font-size="11"  fill="#1F2937" opacity="0.75">只读</text>
<text x="204" y="418" font-size="10"  fill="#1F2937" opacity="0.75">证明写入原生会话</text>
<text x="40" y="544" font-size="12"  fill="#1F2937" opacity="0.6">普通会话无工具也无面板；Reviewer 只读由守卫强制</text>
</svg>